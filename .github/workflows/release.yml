name: Publier une version Windows

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Installer Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Restaurer les dépendances
        run: dotnet restore IracingSetupManager.sln

      - name: Tester
        run: dotnet test IracingSetupManager.sln --configuration Release --maxcpucount:1

      - name: Importer le certificat facultatif
        id: certificate
        if: ${{ secrets.SIGNING_CERTIFICATE_BASE64 != '' && secrets.SIGNING_CERTIFICATE_PASSWORD != '' }}
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'codesigning.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item -LiteralPath $path -Force
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Construire l’installateur
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./installer/Build-Installer.ps1 -Version $version -CertificateThumbprint '${{ steps.certificate.outputs.thumbprint }}'

      - name: Créer la GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $installer = "artifacts/installer/IracingSetupManager-$version-win-x64-setup.exe"
          gh release create '${{ github.ref_name }}' $installer "$installer.sha256" --generate-notes --title "iRacing Setup Manager $version"
